# Qwen-Image-Edit-2509 colorize profile (production engine, Sep 16 2026).
# MangaNinja (manganinja_sd15) RETIRED: halftone mush on toned manga, band-
# painting on palette refs, negative-looking seeds. Qwen-Edit handles
# screentones natively (prompt: "remove the halftone screentone dots") and
# transfers ref palette correctly (verified live: pink hair/blue eyes/blush,
# cross-panel palette stable on 2-panel probe).
# Pooh-approved Sep 16 2026; supersedes the manganinja colorize lane.
id = "qwen_image_edit_2509_colorize"
kind = "colorize"
provider = "comfyui"
workflow = "workflows/qwen_image_edit_2509_colorize.json"

[components]
unet = "qwen_image_edit_2509_fp8_e4m3fn.safetensors"
clip = "qwen_2.5_vl_7b_fp8_scaled.safetensors"
vae = "qwen_image_vae.safetensors"
lora = "Qwen-Image-Edit-2509-Lightning-8steps-V1.0-bf16.safetensors"

[inject]
lineart = "200.inputs.image"       # LoadImage — the B&W panel (tone-carrying OK)
ref_image = "201.inputs.image"     # LoadImage — the approved character sheet
prompt = "1.inputs.value"
seed = "129.inputs.noise_seed"
width = "115.inputs.width"
height = "115.inputs.height"
steps = "124.inputs.steps"
lora_strength = "134.inputs.strength_model"
output = "92.inputs.filename_prefix"

[defaults]
# Verified live (Sep 16): bright, crisp, screentone-free color master.
prompt = """Colorize this black-and-white manga panel using the second image as the color reference for style. Natural skin tones, clean flat anime colors, keep every line and the composition exactly unchanged. Remove the halftone screentone dots, render clean shading."""
seed = 42
steps = 8
lora_strength = 1.0
canvas = "square_512"   # letterbox/square canvas — wide native aspect breaks it

[setup]
weights = [
  {url="https://huggingface.co/Comfy-Org/Qwen-Image-Edit_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_edit_2509_fp8_e4m3fn.safetensors", dir="diffusion_models"},
  {url="https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors", dir="text_encoders"},
  {url="https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors", dir="vae"},
  {url="https://huggingface.co/Osrivers/Qwen-Image-Edit-2509-Lightning-8steps-V1.0-bf16.safetensors/resolve/main/Qwen-Image-Edit-2509-Lightning-8steps-V1.0-bf16.safetensors", dir="loras"},
]
custom_nodes = []             # core ComfyUI nodes only
provenance = "Qwen-Image-Edit-2509 (Apache-2.0) + Lightning 8-step distill LoRA; replaces manganinja_sd15"