# koma — manga-animator configuration
# Paths are RELATIVE TO THE PACKAGE ROOT (repo root). Do not change that
# convention (vidgen inherited trap). Secrets never go in this file — env only.

[paths]
data = "data"
config = "config"

[video]
profile_default = "minimax_h3_fl2va_turbo"   # experimental default; qualification required

[text]
# Reuse the local vision server for text to avoid loading a second model.
# Change model/API to match your installed local server; no cloud fallback.
llm = "qwen2.5-vl-7b"
api = "openai"
# base_url defaults to vision.base_url; override with KOMA_TEXT_BASE_URL.

[vision]
# Example local OpenAI-compatible vision endpoint; match your actual service.
# Installed model identity and service control require hardware qualification.
base_url = "http://192.168.50.103:11434"
model = "qwen2.5-vl-7b"              # Qwen2.5-VL-7B-Q4_K_M + mmproj Q8_0, served by llama.cpp

[gpu]
host = "192.168.50.103"
port = 8188
# boot/ssh credentials come from env only (KOMA_GPU_*), never committed.

[audio]
tts_primary = "gpt_sovits"           # selected first TTS backend; not implemented
bgm_resting_gain = 0.25
