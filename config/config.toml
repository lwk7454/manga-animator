# koma — manga-animator configuration
# Paths are RELATIVE TO THE PACKAGE ROOT (repo root). Do not change that
# convention (vidgen inherited trap). Secrets never go in this file — env only.

[paths]
data = "data"
config = "config"

[video]
profile_default = "h3_fl2va_turbo"   # decision #020: stock lane, zero-config

[text]
llm = "glm-5.3-flash"                # Ollama Cloud (decision #015); env: KOMA_TEXT_API_KEY

[vision]
# llama.cpp server ON THE 3090 BOX (decision #024): OpenAI-shape /v1/chat/completions,
# no filter, explicit art stays LAN-local. Server: C:\llama\start_llama.bat (task koma-llama).
base_url = "http://192.168.50.103:11434"
model = "qwen2.5-vl-7b"              # Qwen2.5-VL-7B-Q4_K_M + mmproj Q8_0, served by llama.cpp

[gpu]
host = "192.168.50.103"
port = 8188
# boot/ssh credentials come from env only (KOMA_GPU_*), never committed.

[audio]
tts_primary = "gpt_sovits"           # decision #003
bgm_resting_gain = 0.25