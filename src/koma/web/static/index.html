<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>koma — workflow console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { background:#111418; color:#d6dade; font:15px/1.5 system-ui, sans-serif; margin:0; }
  header { padding:16px 24px; border-bottom:1px solid #2a2f36; display:flex; gap:16px; align-items:baseline;}
  h1 { font-size:18px; margin:0; color:#e8ebee; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:16px 24px; max-width:1200px; margin:0 auto;}
  section { background:#171b21; border:1px solid #2a2f36; border-radius:10px; padding:14px 16px;}
  h2 { font-size:14px; margin:0 0 10px; color:#9fb3c8; text-transform:uppercase; letter-spacing:.08em;}
  .card { border:1px solid #262c34; border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  button { background:#2b6cb0; color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px;}
  button.secondary { background:#3d4652; }
  button.approve { background:#2f855a; }
  button.reject { background:#c53030; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid #3d4652; }
  .pill.pending { color:#f6e05e; } .pill.approved { color:#68d391; }
  .pill.rejected, .pill.failed { color:#fc8181; } .pill.superseded { color:#a0aec0; }
  .pill.running, .pill.started { color:#63b3ed; }
  img.thumb { max-width:120px; border-radius:6px; display:block; margin-top:6px;}
  input, select, textarea { background:#0e1116; color:#d6dade; border:1px solid #333c47; border-radius:6px; padding:6px 8px; font-size:13px;}
  .muted { color:#8892a0; font-size:12px; }
  .err { color:#fc8181; font-size:12px; white-space:pre-wrap; }
  #status { position:fixed; bottom:12px; right:12px; font-size:12px; color:#9fb3c8; }
</style>
</head>
<body>
<header><h1>koma console</h1><span class="muted" id="seriesLabel"></span></header>
<main>
  <section>
    <h2>Assets — approval gate</h2>
    <div id="assets"></div>
    <div class="row"><button onclick="loadAssets()">refresh</button></div>
  </section>
  <section>
    <h2>Runs</h2>
    <div class="row"><input id="chapterId" placeholder="chapter id" value="ch1" style="width:180px"><button onclick="enqueueRun()">enqueue 16:9 motion</button></div>
    <div id="runs" class="muted">no runs yet</div>
    <h2 style="margin-top:14px">Assembly</h2>
    <div class="row"><input id="shotId" placeholder="shot revision id" style="width:180px"><input id="refAudio" placeholder="ref audio path" style="width:220px"><button onclick="assemble()">assemble</button></div>
    <div id="assembly" class="muted"></div>
    <div id="err" class="err"></div>
  </section>
</main>
<div id="status"></div>
<script>
const S = { series: 'ser1', csrf: '' };
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-koma-csrf': S.csrf }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const t = await r.text(); throw new Error(r.status + ' ' + t); }
  return r.json();
}
async function boot() {
  const r = await fetch('/api/v1/csrf'); S.csrf = (await r.json()).token;
  document.getElementById('seriesLabel').textContent = 'series ' + S.series;
  await loadAssets();
}
async function loadAssets() {
  const data = await api('GET', `/api/v1/series/${S.series}/assets`);
  const el = document.getElementById('assets'); el.innerHTML = '';
  for (const a of data.assets) {
    const rev = a.active_revision || 0;
    const state = a.approval ? a.approval.state : 'none';
    const div = document.createElement('div'); div.className = 'card';
    div.innerHTML = `<div class="row"><strong>${a.name}</strong>
      <span class="pill ${state}">${state}</span><span class="muted">rev ${rev}</span></div>
      <div class="row" style="margin-top:6px">
        <button class="approve" onclick="approve('${a.id}',${rev})">approve r${rev}</button>
        <button class="reject" onclick="reject('${a.id}',${rev})">reject</button>
      </div>
      <div class="muted">${a.id}</div>`;
    el.appendChild(div);
  }
}
async function approve(id, rev) {
  try { await api('POST', `/api/v1/assets/${id}/approve`, { revision: rev, approved_by: 'ui', expected_asset_revision: rev }); loadAssets(); }
  catch (e) { document.getElementById('err').textContent = e.message; }
}
async function reject(id, rev) {
  try { await api('POST', `/api/v1/assets/${id}/reject`, { revision: rev, note: 'rejected in ui' }); loadAssets(); }
  catch (e) { document.getElementById('err').textContent = e.message; }
}
async function enqueueRun() {
  try {
    const res = await api('POST', '/api/v1/runs', { chapter_id: document.getElementById('chapterId').value, ratios: ['16:9'] });
    document.getElementById('runs').innerHTML = res.enqueued.map(x => `<div class="card">${x.work_id}: <span class="pill ${x.status}">${x.status}</span></div>`).join('');
  } catch (e) { document.getElementById('err').textContent = e.message; }
}
async function assemble() {
  try {
    const res = await api('POST', `/api/v1/shots/${document.getElementById('shotId').value}/assemble`,
      { ratio: '16:9', lines: {}, ref_audio_path: document.getElementById('refAudio').value, prompt_text: '' });
    document.getElementById('assembly').innerHTML = `<span class="pill ${res.status}">${res.status}</span>`;
  } catch (e) { document.getElementById('err').textContent = e.message; }
}
setInterval(() => { document.getElementById('status').textContent = 'csrf ' + (S.csrf ? 'ok' : '—'); }, 2000);
boot();
</script>
</body>
</html>
